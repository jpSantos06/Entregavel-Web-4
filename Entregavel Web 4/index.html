<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays, DOM e Eventos</title>
</head>
<body>

    <h1 id="titulo">Meu Blog</h1>

    <p class="texto">Este é o primeiro parágrafo.</p>
    <p class="texto">Este é o segundo parágrafo.</p>
    <p class="texto">Este é o terceiro parágrafo.</p>

    <h2>Lista de tarefas</h2>

    <ul id="lista">
        <li>Item inicial 1</li>
        <li>Item inicial 2</li>
        <li>Item inicial 3</li>
    </ul>

    <button id="botao">Clique aqui</button>

    <br><br>

    <label for="nome">Digite seu nome:</label>
    <input type="text" id="nome">

    <br><br>

    <form id="formulario">
        <label for="tarefa">Nova tarefa:</label>
        <input type="text" id="tarefa">

        <button type="submit">Adicionar tarefa</button>
    </form>

    <script src="app.js"></script>

</body>
</html>
